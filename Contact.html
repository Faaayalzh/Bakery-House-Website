<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contact Us</title>
<link rel="stylesheet" href="bakery.css">
</head>
<body>
<header>
<h1>Bakery House</h1>
<nav>
<a href="Index.Bakery.html">Home</a>
<a href="AboutUs.html">About Us</a>
<a href="menu.html">Menu</a>
<a href="order.html">Orders</a>
<a href="contact.html">Contact Us</a>
</nav>
</header>
<main>
<h2>Contact Us</h2>
<p>Have a question or need assistance? Fill out the form below, and we will get back to you as soon as possible.</p>
<form id="contactForm">
<label for="name">Your Name:</label>
<input type="text" id="name" name="name" required placeholder="Enter your name">
<label for="email">Your Email:</label>
<input type="email" id="email" name="email" required placeholder="Enter your email">
<label for="message">Your Message:</label>
<textarea id="message" name="message" required placeholder="Write your message here"></textarea>
<button type="submit">Submit</button>
</form>
<div id="confirmationMessage" style="display: none;">
<h3>Thank you for contacting us!</h3>
<p>We have received your message. Our team will get back to you shortly.</p>
<button id="goBackButton">Send Another Message</button>
</div>
</main>
<script>
const form=document.getElementById("contactForm");
const confirmationMessage=document.getElementById("confirmationMessage");
const goBackButton=document.getElementById("goBackButton");
form.addEventListener("submit",function(e){
e.preventDefault();
form.style.display="none";
confirmationMessage.style.display="block";
});
goBackButton.addEventListener("click",function(){
form.reset();
form.style.display="block";
confirmationMessage.style.display="none";
});
</script>
</body>
</html>
